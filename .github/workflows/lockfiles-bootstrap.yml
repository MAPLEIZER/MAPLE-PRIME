name: lockfiles-bootstrap

on:
  push:
    paths:
      - '.github/workflows/lockfiles-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/agent/alpha-0-30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/alpha-0-30
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate npm lockfiles
        shell: bash
        run: |
          (cd apps/web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd apps/mobile && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
      - name: Generate Python lockfiles
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'pip-tools>=7,<8'
          (cd apps/api && pip-compile pyproject.toml --extra dev --output-file requirements.lock --strip-extras)
          (cd tools/installer && pip-compile pyproject.toml --extra test --extra build --output-file requirements.lock --strip-extras)
      - name: Commit generated lockfiles
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json apps/mobile/package-lock.json apps/api/requirements.lock tools/installer/requirements.lock
          git diff --cached --exit-code && exit 0
          git commit -m 'build: add reproducible dependency locks'
          git push origin HEAD:agent/alpha-0-30
