name: runtime-lock-bootstrap

on:
  push:
    paths:
      - '.github/workflows/runtime-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/agent/alpha-0-30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/alpha-0-30
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pip-tools>=7,<8'
      - name: Generate API runtime lock
        shell: bash
        run: |
          cd apps/api
          pip-compile pyproject.toml --output-file requirements-runtime.lock --strip-extras
      - name: Commit runtime lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/requirements-runtime.lock
          git diff --cached --exit-code && exit 0
          git commit -m 'build: add API runtime dependency lock'
          git push origin HEAD:agent/alpha-0-30
