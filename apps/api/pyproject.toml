[build-system]
requires = ["setuptools>=80,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "kenya-data-rights-api"
version = "0.1.0a1"
description = "Local-first API for Kenya Data Rights"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.35,<0.53",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "cryptography>=44,<46",
  "httpx>=0.28,<0.29",
  "pypdf>=6.14,<7",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<0.17",
]
ml = [
  "xgboost>=3.3,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "migrations*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
