pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  server_tokens off;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Large indexed-provider research is intentionally bounded, but category
    # breadth crawling plus optional product enrichment can legitimately exceed
    # five minutes when the provider is slow. Keep the longer window scoped to
    # this explicit local operator action rather than relaxing every API route.
    # The server-side page/app/enrichment caps remain the actual work bounds.
    location = /api/v1/apps/discovery/research {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }

    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 90s;
    }

    location = /kdr-logo-transparent.png {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    location = /kdr-app-icon.png {
      add_header Cache-Control "no-cache, must-revalidate" always;
      try_files $uri =404;
    }

    # Browsers and pinned tabs still probe the conventional favicon path even
    # when index.html advertises a PNG icon. Serve the exact packaged KDR icon
    # bytes here rather than letting the SPA fallback return index.html.
    location = /favicon.ico {
      types { }
      default_type image/png;
      alias /usr/share/nginx/html/kdr-app-icon.png;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
