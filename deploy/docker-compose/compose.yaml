services:
  api:
    build:
      context: ../../apps/api
    environment:
      KDR_ENV: development
      KDR_DATABASE_URL: sqlite:////data/kdr.sqlite3
      KDR_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - kdr-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../../apps/web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  kdr-data:
